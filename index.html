<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>🛒 Lista de Compras</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: system-ui, -apple-system, sans-serif;
    background: #0f172a;
    color: #e2e8f0;
    padding: 15px;
    min-height: 100vh;
  }
  h1 { font-size: 1.3em; text-align: center; margin-bottom: 15px; }

  .app {
    max-width: 700px;
    margin: 0 auto;
    display: flex;
    flex-direction: column;
    gap: 12px;
  }

  .card {
    background: #1e293b;
    border-radius: 12px;
    padding: 15px;
  }
  .card h2 {
    font-size: .9em;
    color: #fbbf24;
    margin-bottom: 10px;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }

  /* Abas */
  .abas {
    display: flex;
    gap: 6px;
    background: #1e293b;
    padding: 4px;
    border-radius: 10px;
  }
  .aba {
    flex: 1;
    padding: 10px;
    border: none;
    border-radius: 8px;
    cursor: pointer;
    font-weight: bold;
    font-size: .85em;
    background: transparent;
    color: #94a3b8;
    transition: .15s;
  }
  .aba.ativa { background: #16a34a; color: white; }

  /* Formulário */
  .form-linha {
    display: grid;
    grid-template-columns: 1fr 80px auto;
    gap: 6px;
    margin-bottom: 8px;
  }
  @media (max-width: 500px) {
    .form-linha { grid-template-columns: 1fr 70px; }
    .form-linha button { grid-column: span 2; }
  }
  input[type="text"], input[type="number"] {
    padding: 10px;
    border-radius: 8px;
    border: 1px solid #334155;
    background: #0f172a;
    color: white;
    font-size: .9em;
    width: 100%;
  }
  input:focus { outline: none; border-color: #fbbf24; }
  input::placeholder { color: #64748b; }

  button {
    padding: 10px 14px;
    border: none;
    border-radius: 8px;
    cursor: pointer;
    font-weight: bold;
    font-size: .85em;
    color: white;
  }
  .btn-verde { background: #16a34a; }
  .btn-verde:hover { background: #15803d; }
  .btn-azul { background: #2563eb; }
  .btn-cinza { background: #475569; }
  .btn-vermelho { background: #dc2626; }

  /* Busca */
  .busca {
    margin-bottom: 10px;
  }

  /* Catálogo / seleção */
  .catalogo-lista {
    max-height: 400px;
    overflow-y: auto;
    margin-bottom: 10px;
  }
  .produto-sel {
    display: grid;
    grid-template-columns: 24px 1fr auto;
    gap: 10px;
    align-items: center;
    padding: 10px;
    background: #0f172a;
    border-radius: 8px;
    margin-bottom: 6px;
    cursor: pointer;
    border-left: 3px solid transparent;
    transition: .15s;
  }
  .produto-sel:hover { background: #334155; }
  .produto-sel.selecionado {
    border-left-color: #16a34a;
    background: #14532d33;
  }
  .produto-sel input[type="checkbox"] {
    width: 20px; height: 20px; cursor: pointer; accent-color: #16a34a;
  }
  .produto-sel .info .nome { font-weight: 600; font-size: .9em; }
  .produto-sel .info .det { font-size: .75em; color: #94a3b8; margin-top: 2px; }
  .produto-sel .info .det .ultimo { color: #38bdf8; }
  .produto-sel .qtd-input {
    width: 60px;
    padding: 6px;
    font-size: .85em;
    text-align: center;
  }

  /* Item da lista */
  .item {
    background: #0f172a;
    border-radius: 8px;
    margin-bottom: 6px;
    border-left: 3px solid #475569;
    overflow: hidden;
    transition: .15s;
  }
  .item.comprado { opacity: .55; border-left-color: #16a34a; }
  .item.comprado .nome { text-decoration: line-through; }

  .item-linha {
    display: grid;
    grid-template-columns: 24px 1fr auto auto;
    gap: 10px;
    align-items: center;
    padding: 10px;
    cursor: pointer;
  }
  .item-linha:hover { background: #1e293b; }

  .item .nome { font-weight: 600; font-size: .9em; }
  .item .detalhe { font-size: .75em; color: #94a3b8; margin-top: 2px; }
  .item .detalhe .ultimo { color: #38bdf8; }
  .item .detalhe .mudou { color: #f87171; }
  .item .detalhe .sem-preco { color: #64748b; font-style: italic; }

  .item .preco-atual {
    color: #fbbf24;
    font-weight: bold;
    font-size: .9em;
    white-space: nowrap;
  }
  .item .preco-atual.vazio { color: #475569; }

  .item input[type="checkbox"] {
    width: 18px; height: 18px; cursor: pointer; accent-color: #16a34a;
  }
  .item .btn-del {
    background: transparent;
    color: #ef4444;
    padding: 4px 8px;
    font-size: 1em;
  }
  .item .btn-del:hover { background: #7f1d1d; }

  .item-editor {
    display: none;
    padding: 10px;
    background: #1e293b;
    border-top: 1px solid #334155;
    gap: 8px;
    align-items: center;
  }
  .item-editor.aberto { display: flex; }
  .item-editor label { font-size: .8em; color: #94a3b8; white-space: nowrap; }
  .item-editor input { flex: 1; padding: 8px; }
  .item-editor .btn-salvar-preco { background: #16a34a; padding: 8px 14px; }

  /* Total */
  .total {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 12px 15px;
    background: #1e293b;
    border-radius: 12px;
    font-size: 1em;
    border: 2px solid #fbbf24;
  }
  .total b { color: #fbbf24; font-size: 1.2em; }

  #status {
    font-size: .75em;
    text-align: center;
    padding: 6px;
    border-radius: 6px;
    background: #78350f;
  }
  #status.ok { background: #14532d; }
  #status.erro { background: #7f1d1d; }

  .historico {
    max-height: 250px;
    overflow-y: auto;
    font-size: .8em;
  }
  .historico-linha {
    display: flex;
    justify-content: space-between;
    padding: 6px 8px;
    border-bottom: 1px dashed #334155;
  }
  .historico-linha:last-child { border-bottom: none; }
  .historico-linha .nome { color: #e2e8f0; }
  .historico-linha .preco { color: #fbbf24; font-weight: bold; }

  .vazio {
    text-align: center;
    padding: 20px;
    font-size: .85em;
    opacity: .5;
  }

  .acoes {
    display: flex;
    gap: 6px;
    margin-top: 8px;
  }
  .acoes button { flex: 1; }

  .badge {
    font-size: .7em;
    background: #fbbf24;
    color: #0f172a;
    padding: 2px 8px;
    border-radius: 10px;
    font-weight: bold;
  }
</style>
</head>
<body>

<h1>🛒 Lista de Compras</h1>

<div class="app">

  <div id="status">🔄 Conectando...</div>

  <!-- Abas -->
  <div class="abas">
    <button class="aba ativa" id="abaLista" onclick="mudarAba('lista')">📝 Lista atual</button>
    <button class="aba" id="abaNova" onclick="mudarAba('nova')">➕ Nova lista</button>
    <button class="aba" id="abaProdutos" onclick="mudarAba('produtos')">📦 Produtos</button>
  </div>

  <!-- ===== ABA: LISTA ATUAL ===== -->
  <div id="telaLista">
    <div class="card">
      <h2>
        <span>📝 Lista atual</span>
        <button class="btn-cinza" style="padding:4px 10px; font-size:.75em;" onclick="limparComprados()">🧹 Limpar comprados</button>
      </h2>
      <div id="lista"></div>
    </div>

    <div class="total" style="margin-top:12px;">
      <span>💰 Total da lista</span>
      <b id="total">R$ 0,00</b>
    </div>
  </div>

  <!-- ===== ABA: NOVA LISTA ===== -->
  <div id="telaNova" style="display:none;">
    <div class="card">
      <h2>➕ Montar nova lista</h2>
      <div class="busca">
        <input type="text" id="buscaProduto" placeholder="🔍 Buscar produto..." oninput="renderizarCatalogo()">
      </div>
      <div class="catalogo-lista" id="catalogoLista"></div>
      <div class="acoes">
        <button class="btn-verde" onclick="criarListaComSelecionados()">✅ Criar lista com selecionados</button>
      </div>
      <div style="font-size:.75em; color:#94a3b8; margin-top:8px; text-align:center;">
        Produto não está na lista? Vá em <b>📦 Produtos</b> e cadastre.
      </div>
    </div>
  </div>

  <!-- ===== ABA: PRODUTOS (catálogo) ===== -->
  <div id="telaProdutos" style="display:none;">
    <div class="card">
      <h2>📦 Cadastrar produto</h2>
      <div class="form-linha">
        <input type="text" id="novoProdutoNome" placeholder="Nome do produto" autocomplete="off">
        <input type="number" id="novoProdutoPreco" placeholder="Últ. preço" step="0.01" min="0">
        <button class="btn-verde" onclick="cadastrarProduto()">Adicionar</button>
      </div>
      <div style="font-size:.75em; color:#94a3b8; margin-top:6px;">
        💡 O preço é opcional — pode cadastrar só o nome agora e definir o preço no mercado.
      </div>
    </div>

    <div class="card" style="margin-top:12px;">
      <h2>
        <span>📦 Produtos cadastrados</span>
        <span class="badge" id="badgeProdutos">0</span>
      </h2>
      <div class="busca">
        <input type="text" id="buscaProdutosCad" placeholder="🔍 Buscar..." oninput="renderizarProdutosCadastrados()">
      </div>
      <div class="historico" id="produtosCadastrados" style="max-height:400px;"></div>
    </div>
  </div>

</div>

<script type="importmap">
{
  "imports": {
    "firebase/app": "https://www.gstatic.com/firebasejs/12.18.0/firebase-app.js",
    "firebase/firestore": "https://www.gstatic.com/firebasejs/12.18.0/firebase-firestore.js"
  }
}
</script>

<script type="module">
import { initializeApp } from "firebase/app";
import {
  getFirestore, collection, addDoc, deleteDoc, doc,
  updateDoc, onSnapshot, query, orderBy, where, getDocs, setDoc
} from "firebase/firestore";

// ===== CONFIG (mantenha a sua) =====
const firebaseConfig = {
  apiKey: "AIzaSyAyAtL3v2jSnUd4gGAU0zWXhqI84kngsio",
  authDomain: "fiscalizador-preco.firebaseapp.com",
  projectId: "fiscalizador-preco",
  storageBucket: "fiscalizador-preco.firebasestorage.app",
  messagingSenderId: "968106554702",
  appId: "1:968106554702:web:e812a8e07e2aac33eb5a1f"
};
const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

const COL_ITENS = 'compras';        // itens da lista atual
const COL_PRODUTOS = 'produtos';    // catálogo de produtos

// ===== ESTADO =====
let itens = [];            // lista atual
let produtos = [];         // catálogo
let selecionados = new Map(); // idProduto -> {nome, qtd}
let editorAberto = null;
let abaAtual = 'lista';

const statusEl = document.getElementById('status');
function setStatus(msg, tipo = '') {
  statusEl.textContent = msg;
  statusEl.className = tipo;
}
const fmt = (n) => 'R$ ' + Number(n).toFixed(2).replace('.', ',');

// ===== ABAS =====
window.mudarAba = function(aba) {
  abaAtual = aba;
  document.getElementById('telaLista').style.display    = aba === 'lista'    ? 'block' : 'none';
  document.getElementById('telaNova').style.display     = aba === 'nova'     ? 'block' : 'none';
  document.getElementById('telaProdutos').style.display = aba === 'produtos' ? 'block' : 'none';
  document.getElementById('abaLista').classList.toggle('ativa', aba === 'lista');
  document.getElementById('abaNova').classList.toggle('ativa', aba === 'nova');
  document.getElementById('abaProdutos').classList.toggle('ativa', aba === 'produtos');

  if (aba === 'nova') renderizarCatalogo();
  if (aba === 'produtos') renderizarProdutosCadastrados();
};

// ===== HISTÓRICO: último preço por produto =====
function calcularHistorico(lista) {
  const mapa = {};
  const ordenados = [...lista].sort((a, b) => (a.data || '').localeCompare(b.data || ''));
  ordenados.forEach(item => {
    if (!item.preco || item.preco <= 0) return;
    const chave = item.nome.toLowerCase().trim();
    mapa[chave] = { nome: item.nome, preco: item.preco, data: item.data };
  });
  return Object.values(mapa);
}

// ===== CATÁLOGO: mescla produtos cadastrados + itens já comprados =====
function catalogoCompleto() {
  const mapa = new Map();
  // primeiro os produtos cadastrados
  produtos.forEach(p => {
    const k = p.nome.toLowerCase().trim();
    mapa.set(k, { id: p.id, nome: p.nome, ultimoPreco: p.ultimoPreco || null });
  });
  // depois itens de compras (atualiza último preço e cria se não existir)
  const hist = calcularHistorico(itens);
  hist.forEach(h => {
    const k = h.nome.toLowerCase().trim();
    if (mapa.has(k)) {
      mapa.get(k).ultimoPreco = h.preco;
    } else {
      mapa.set(k, { id: 'temp-' + k, nome: h.nome, ultimoPreco: h.preco });
    }
  });
  return [...mapa.values()].sort((a, b) => a.nome.localeCompare(b.nome));
}

// ===== RENDER: CATÁLOGO (tela nova lista) =====
function renderizarCatalogo() {
  const el = document.getElementById('catalogoLista');
  const busca = (document.getElementById('buscaProduto').value || '').toLowerCase().trim();
  const lista = catalogoCompleto().filter(p => p.nome.toLowerCase().includes(busca));

  if (lista.length === 0) {
    el.innerHTML = '<div class="vazio">Nenhum produto. Cadastre na aba 📦 Produtos.</div>';
    return;
  }

  el.innerHTML = lista.map(p => {
    const sel = selecionados.has(p.id);
    const ult = p.ultimoPreco ? `<span class="ultimo">• último: ${fmt(p.ultimoPreco)}</span>` : '<span style="opacity:.5">• sem preço</span>';
    const qtd = sel ? selecionados.get(p.id).qtd : 1;
    return `
      <div class="produto-sel ${sel ? 'selecionado' : ''}" onclick="window.__toggleSelecionado('${p.id}')">
        <input type="checkbox" ${sel ? 'checked' : ''} onclick="event.stopPropagation(); window.__toggleSelecionado('${p.id}')">
        <div class="info">
          <div class="nome">${p.nome}</div>
          <div class="det">${ult}</div>
        </div>
        ${sel
          ? `<input type="number" class="qtd-input" min="1" value="${qtd}"
                    onclick="event.stopPropagation()"
                    onchange="window.__mudarQtd('${p.id}', this.value)">`
          : '<span style="width:60px"></span>'}
      </div>
    `;
  }).join('');
}

window.__toggleSelecionado = function(id) {
  if (selecionados.has(id)) {
    selecionados.delete(id);
  } else {
    const p = catalogoCompleto().find(x => x.id === id);
    if (p) selecionados.set(id, { nome: p.nome, qtd: 1, ultimoPreco: p.ultimoPreco });
  }
  renderizarCatalogo();
};
window.__mudarQtd = function(id, v) {
  const q = parseInt(v) || 1;
  if (selecionados.has(id)) selecionados.get(id).qtd = q;
  renderizarCatalogo();
};

// ===== CRIAR LISTA COM SELECIONADOS =====
window.criarListaComSelecionados = async function() {
  if (selecionados.size === 0) {
    alert('Selecione pelo menos um produto.');
    return;
  }
  const ativos = itens.filter(i => !i.comprado);
  if (ativos.length > 0) {
    if (!confirm(`Já existem ${ativos.length} item(ns) na lista atual. Deseja apagá-los e criar a nova lista?`)) return;
    await Promise.all(ativos.map(i => deleteDoc(doc(db, COL_ITENS, i.id))));
  }

  const data = new Date().toISOString();
  await Promise.all([...selecionados.values()].map(s =>
    addDoc(collection(db, COL_ITENS), {
      nome: s.nome,
      qtd: s.qtd,
      preco: null,
      comprado: false,
      data
    })
  ));

  selecionados.clear();
  mudarAba('lista');
  setStatus('✅ Lista criada!', 'ok');
};

// ===== RENDER: LISTA ATUAL =====
function renderizar() {
  const el = document.getElementById('lista');
  const ativos = itens.filter(i => !i.comprado);
  const comprados = itens.filter(i => i.comprado);

  if (itens.length === 0) {
    el.innerHTML = '<div class="vazio">Nenhum item. Vá em ➕ Nova lista.</div>';
    document.getElementById('total').textContent = fmt(0);
    return;
  }

  const renderItem = (item) => {
    const h = calcularHistorico(itens).find(x => x.nome.toLowerCase() === item.nome.toLowerCase().trim());
    const ultimoPreco = h ? h.preco : null;
    const temPreco = item.preco && item.preco > 0;
    const mudou = temPreco && ultimoPreco && Math.abs(ultimoPreco - item.preco) > 0.001 &&
                  item.data !== h.data; // ignora se é o mesmo registro
    const editorAbertoAqui = editorAberto === item.id;

    let detalhe = `${item.qtd}x`;
    if (!temPreco) {
      detalhe += ultimoPreco
        ? ` <span class="ultimo">• último: ${fmt(ultimoPreco)}</span>`
        : ` <span class="sem-preco">• sem preço</span>`;
    } else {
      detalhe += ` ${fmt(item.preco)} cada = ${fmt(item.preco * item.qtd)}`;
      if (mudou) detalhe += ` <span class="mudou">(antes ${fmt(ultimoPreco)})</span>`;
    }

    const precoHtml = temPreco
      ? `<div class="preco-atual">${fmt(item.preco * item.qtd)}</div>`
      : `<div class="preco-atual vazio">+ preço</div>`;

    return `
      <div class="item ${item.comprado ? 'comprado' : ''}">
        <div class="item-linha" onclick="window.__abrirEditor('${item.id}')">
          <input type="checkbox" ${item.comprado ? 'checked' : ''}
                 onclick="event.stopPropagation()"
                 onchange="window.__toggle('${item.id}', ${!item.comprado})">
          <div>
            <div class="nome">${item.nome}</div>
            <div class="detalhe">${detalhe}</div>
          </div>
          ${precoHtml}
          <button class="btn-del" onclick="event.stopPropagation(); window.__excluir('${item.id}')">✕</button>
        </div>
        <div class="item-editor ${editorAbertoAqui ? 'aberto' : ''}">
          <label>Preço un.:</label>
          <input type="number" step="0.01" min="0" placeholder="0,00"
                 value="${temPreco ? item.preco : ''}"
                 id="preco-${item.id}"
                 onkeydown="if(event.key==='Enter') window.__salvarPreco('${item.id}')">
          <button class="btn-salvar-preco" onclick="window.__salvarPreco('${item.id}')">✓</button>
          <button class="btn-cinza" onclick="event.stopPropagation(); window.__fecharEditor()">✕</button>
        </div>
      </div>
    `;
  };

  el.innerHTML = ativos.map(renderItem).join('') +
    (comprados.length ? `<div style="font-size:.7em; color:#64748b; margin:10px 0 4px;">— comprados —</div>` +
      comprados.map(renderItem).join('') : '');

  const total = ativos.reduce((s, i) => s + (i.preco || 0) * i.qtd, 0);
  document.getElementById('total').textContent = fmt(total);

  if (editorAberto) {
    const inp = document.getElementById('preco-' + editorAberto);
    if (inp) inp.focus();
  }
}

// ===== RENDER: PRODUTOS CADASTRADOS =====
function renderizarProdutosCadastrados() {
  const el = document.getElementById('produtosCadastrados');
  const busca = (document.getElementById('buscaProdutosCad').value || '').toLowerCase().trim();
  const lista = catalogoCompleto().filter(p => p.nome.toLowerCase().includes(busca));
  document.getElementById('badgeProdutos').textContent = lista.length;

  if (lista.length === 0) {
    el.innerHTML = '<div class="vazio">Nenhum produto.</div>';
    return;
  }
  el.innerHTML = lista.map(p => `
    <div class="historico-linha">
      <span class="nome">${p.nome}</span>
      <span>
        ${p.ultimoPreco ? `<b class="preco">${fmt(p.ultimoPreco)}</b>` : '<span style="opacity:.5; font-size:.85em;">sem preço</span>'}
        ${p.id && !p.id.startsWith('temp-') ? `<button class="btn-del" style="background:transparent;color:#ef4444;margin-left:6px;" onclick="event.stopPropagation(); window.__excluirProduto('${p.id}', '${p.nome.replace(/'/g,"\\'")}')">✕</button>` : ''}
      </span>
    </div>
  `).join('');
}

// ===== CADASTRAR PRODUTO =====
window.cadastrarProduto = async function() {
  const nome = document.getElementById('novoProdutoNome').value.trim();
  const preco = parseFloat(document.getElementById('novoProdutoPreco').value) || null;
  if (!nome) { alert('Digite o nome.'); return; }

  // Verifica duplicata
  const existe = produtos.find(p => p.nome.toLowerCase().trim() === nome.toLowerCase().trim());
  if (existe) { alert('Já existe um produto com esse nome.'); return; }

  await addDoc(collection(db, COL_PRODUTOS), {
    nome,
    ultimoPreco: preco,
    criadoEm: new Date().toISOString()
  });
  document.getElementById('novoProdutoNome').value = '';
  document.getElementById('novoProdutoPreco').value = '';
  document.getElementById('novoProdutoNome').focus();
};

window.__excluirProduto = async function(id, nome) {
  if (!confirm(`Excluir produto "${nome}"?`)) return;
  await deleteDoc(doc(db, COL_PRODUTOS, id));
};

// ===== DEFINIR PREÇO (no mercado) =====
async function definirPreco(id, preco) {
  if (!preco || preco <= 0) { alert('Digite um preço válido.'); return; }
  const item = itens.find(i => i.id === id);
  await updateDoc(doc(db, COL_ITENS, id), {
    preco: Number(preco),
    data: new Date().toISOString()
  });
  // Atualiza catálogo de produtos (último preço) — se produto existir
  if (item) {
    const k = item.nome.toLowerCase().trim();
    const prod = produtos.find(p => p.nome.toLowerCase().trim() === k);
    if (prod) {
      await updateDoc(doc(db, COL_PRODUTOS, prod.id), { ultimoPreco: Number(preco) });
    } else {
      // cria produto automaticamente
      await addDoc(collection(db, COL_PRODUTOS), {
        nome: item.nome,
        ultimoPreco: Number(preco),
        criadoEm: new Date().toISOString()
      });
    }
  }
  editorAberto = null;
}

// ===== AÇÕES =====
async function toggle(id, novoComprado) {
  await updateDoc(doc(db, COL_ITENS, id), { comprado: novoComprado });
}
async function excluir(id) {
  if (!confirm('Excluir este item?')) return;
  await deleteDoc(doc(db, COL_ITENS, id));
}
async function limparComprados() {
  const comprados = itens.filter(i => i.comprado);
  if (!comprados.length) return;
  if (!confirm(`Excluir ${comprados.length} item(ns) comprado(s)?`)) return;
  await Promise.all(comprados.map(i => deleteDoc(doc(db, COL_ITENS, i.id))));
}
function abrirEditor(id) { editorAberto = (editorAberto === id) ? null : id; renderizar(); }
function fecharEditor() { editorAberto = null; renderizar(); }
async function salvarPreco(id) {
  const inp = document.getElementById('preco-' + id);
  const v = parseFloat(inp.value);
  if (!v || v <= 0) { alert('Digite um preço válido.'); inp.focus(); return; }
  await definirPreco(id, v);
}

// ===== FIRESTORE =====
function escutar() {
  setStatus('🔄 Conectando...');
  let primeiro = true;

  onSnapshot(collection(db, COL_ITENS), snap => {
    itens = snap.docs.map(d => ({ id: d.id, ...d.data() }));
    if (abaAtual === 'lista') renderizar();
    if (abaAtual === 'nova') renderizarCatalogo();
    if (abaAtual === 'produtos') renderizarProdutosCadastrados();
    if (primeiro) { setStatus('✅ Conectado', 'ok'); primeiro = false; }
  }, err => setStatus('❌ ' + err.message, 'erro'));

  onSnapshot(collection(db, COL_PRODUTOS), snap => {
    produtos = snap.docs.map(d => ({ id: d.id, ...d.data() }));
    if (abaAtual === 'nova') renderizarCatalogo();
    if (abaAtual === 'produtos') renderizarProdutosCadastrados();
  }, err => console.error(err));
}

// ===== EXPOR =====
window.__toggle = toggle;
window.__excluir = excluir;
window.__abrirEditor = abrirEditor;
window.__fecharEditor = fecharEditor;
window.__salvarPreco = salvarPreco;
window.limparComprados = limparComprados;

// ===== START =====
escutar();
mudarAba('lista');
</script>
