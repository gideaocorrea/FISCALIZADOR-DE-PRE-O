<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Controle PIX x NF</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
    background: #f4f6f8;
    color: #222;
    min-height: 100vh;
  }
  header {
    background: #1e293b;
    color: #fff;
    padding: 12px 16px;
    position: sticky;
    top: 0;
    z-index: 100;
    box-shadow: 0 2px 6px rgba(0,0,0,.15);
  }
  header h1 { font-size: 16px; font-weight: 600; margin-bottom: 10px; opacity: .9; }
  .empresas {
    display: flex; gap: 8px; overflow-x: auto;
    padding-bottom: 4px; align-items: center;
  }
  .empresa-btn {
    background: #334155; color: #cbd5e1;
    border: 1px solid #475569;
    padding: 8px 12px; border-radius: 8px;
    cursor: pointer; font-size: 14px; white-space: nowrap;
    transition: all .15s; font-weight: 500;
    display: flex; align-items: center; gap: 6px;
  }
  .empresa-btn:hover { background: #475569; color: #fff; }
  .empresa-btn.ativa {
    background: #3b82f6; border-color: #3b82f6; color: #fff;
    box-shadow: 0 0 0 2px rgba(59,130,246,.4);
  }
  .empresa-btn .lapis, .empresa-btn .lixo {
    font-size: 11px; opacity: .6; padding: 2px 4px;
    border-radius: 4px; transition: all .15s;
  }
  .empresa-btn .lapis:hover, .empresa-btn .lixo:hover {
    opacity: 1; background: rgba(255,255,255,.2);
  }
  .btn-nova {
    background: #16a34a; color: #fff; border: none;
    padding: 8px 14px; border-radius: 8px;
    cursor: pointer; font-size: 14px; font-weight: 600;
    white-space: nowrap; transition: background .15s;
  }
  .btn-nova:hover { background: #15803d; }

  main { padding: 20px; max-width: 1200px; margin: 0 auto; }

  .titulo-empresa { font-size: 22px; font-weight: 700; margin-bottom: 4px; }
  .resumo { font-size: 14px; color: #64748b; margin-bottom: 20px; }
  .resumo strong { color: #dc2626; }

  #status {
    font-size: 12px; text-align: center; padding: 6px;
    border-radius: 6px; background: #fef3c7; color: #92400e;
    margin-bottom: 12px; font-weight: 600;
  }
  #status.ok { background: #dcfce7; color: #166534; }
  #status.erro { background: #fee2e2; color: #991b1b; }

  .form-box {
    background: #fff; border-radius: 10px; padding: 16px;
    margin-bottom: 20px; box-shadow: 0 1px 3px rgba(0,0,0,.08);
    display: flex; flex-wrap: wrap; gap: 10px; align-items: flex-end;
  }
  .form-box .campo { display: flex; flex-direction: column; flex: 1; min-width: 140px; }
  .form-box label { font-size: 12px; color: #64748b; margin-bottom: 4px; font-weight: 600; }
  .form-box input {
    padding: 8px 10px; border: 1px solid #cbd5e1; border-radius: 6px;
    font-size: 14px; outline: none; transition: border .15s;
    background: #fff; color: #222;
  }
  .form-box input:focus { border-color: #3b82f6; }
  .btn-add {
    background: #16a34a; color: #fff; border: none;
    padding: 9px 20px; border-radius: 6px; font-size: 14px;
    font-weight: 600; cursor: pointer; transition: background .15s;
    height: 38px;
  }
  .btn-add:hover { background: #15803d; }

  .colunas { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
  @media (max-width: 700px) { .colunas { grid-template-columns: 1fr; } }

  .coluna {
    background: #fff; border-radius: 10px; padding: 14px;
    box-shadow: 0 1px 3px rgba(0,0,0,.08); min-height: 200px;
  }
  .coluna h2 {
    font-size: 15px; font-weight: 700; margin-bottom: 12px;
    padding-bottom: 10px; border-bottom: 2px solid #e2e8f0;
    display: flex; justify-content: space-between; align-items: center;
  }
  .coluna.pendente h2 { color: #d97706; border-color: #fde68a; }
  .coluna.concluido h2 { color: #16a34a; border-color: #bbf7d0; }
  .contador {
    background: #f1f5f9; color: #475569; font-size: 12px;
    padding: 2px 8px; border-radius: 10px; font-weight: 600;
  }

  .card {
    background: #f8fafc; border: 1px solid #e2e8f0;
    border-left: 4px solid #f59e0b; border-radius: 8px;
    padding: 12px; margin-bottom: 10px;
    transition: transform .1s, box-shadow .1s;
  }
  .card:hover { transform: translateY(-1px); box-shadow: 0 2px 8px rgba(0,0,0,.08); }
  .card.concluido-card { border-left-color: #16a34a; opacity: .85; }
  .card .linha1 {
    display: flex; justify-content: space-between;
    align-items: center; margin-bottom: 6px; gap: 8px;
  }
  .card .fornecedor {
    font-weight: 700; font-size: 15px; color: #1e293b; word-break: break-word;
  }
  .card .valor {
    font-weight: 700; font-size: 15px; color: #dc2626; white-space: nowrap;
  }
  .card.concluido-card .valor { color: #16a34a; }
  .card .desc { font-size: 13px; color: #64748b; margin-bottom: 8px; word-break: break-word; }
  .card .meta { font-size: 12px; color: #94a3b8; margin-bottom: 10px; }
  .card .acoes { display: flex; gap: 8px; flex-wrap: wrap; }
  .card button {
    border: none; padding: 6px 12px; border-radius: 6px;
    font-size: 13px; font-weight: 600; cursor: pointer;
    transition: background .15s;
  }
  .btn-nf { background: #16a34a; color: #fff; }
  .btn-nf:hover { background: #15803d; }
  .btn-voltar { background: #e2e8f0; color: #475569; }
  .btn-voltar:hover { background: #cbd5e1; }
  .btn-editar { background: #dbeafe; color: #1d4ed8; }
  .btn-editar:hover { background: #bfdbfe; }
  .btn-excluir { background: #fee2e2; color: #dc2626; }
  .btn-excluir:hover { background: #fecaca; }

  .vazio {
    text-align: center; color: #94a3b8; font-size: 13px;
    padding: 30px 10px; font-style: italic;
  }

  .modal-fundo {
    display: none; position: fixed; inset: 0;
    background: rgba(0,0,0,.5); z-index: 200;
    align-items: center; justify-content: center; padding: 20px;
  }
  .modal-fundo.aberto { display: flex; }
  .modal {
    background: #fff; border-radius: 12px; padding: 22px;
    width: 100%; max-width: 480px;
    box-shadow: 0 10px 40px rgba(0,0,0,.25);
  }
  .modal h3 { font-size: 18px; margin-bottom: 16px; color: #1e293b; }
  .modal .campo { display: flex; flex-direction: column; margin-bottom: 12px; }
  .modal label { font-size: 12px; color: #64748b; margin-bottom: 4px; font-weight: 600; }
  .modal input {
    padding: 9px 11px; border: 1px solid #cbd5e1;
    border-radius: 6px; font-size: 14px; outline: none;
    transition: border .15s;
  }
  .modal input:focus { border-color: #3b82f6; }
  .modal .botoes {
    display: flex; gap: 10px; justify-content: flex-end; margin-top: 18px;
  }
  .modal .botoes button {
    padding: 9px 18px; border-radius: 6px; font-size: 14px;
    font-weight: 600; cursor: pointer; border: none;
    transition: background .15s;
  }
  .btn-cancelar { background: #e2e8f0; color: #475569; }
  .btn-cancelar:hover { background: #cbd5e1; }
  .btn-salvar { background: #3b82f6; color: #fff; }
  .btn-salvar:hover { background: #2563eb; }
</style>
</head>
<body>

<header>
  <h1>🏢 Empresas</h1>
  <div class="empresas" id="empresasBar"></div>
</header>

<main>
  <div id="status">🔄 Conectando...</div>

  <div class="titulo-empresa" id="tituloEmpresa"></div>
  <div class="resumo" id="resumo"></div>

  <div class="form-box">
    <div class="campo">
      <label>Fornecedor / Empresa</label>
      <input type="text" id="inpFornecedor" placeholder="Ex: Papelaria ABC">
    </div>
    <div class="campo">
      <label>Valor do PIX (R$)</label>
      <input type="text" id="inpValor" placeholder="Ex: 15000 ou 15.000,00" inputmode="decimal" autocomplete="off">
    </div>
    <div class="campo">
      <label>Descrição</label>
      <input type="text" id="inpDesc" placeholder="Ex: Material de escritório">
    </div>
    <div class="campo">
      <label>Data do PIX</label>
      <input type="date" id="inpData">
    </div>
    <button class="btn-add" onclick="adicionarPix()">+ Adicionar PIX</button>
  </div>

  <div class="colunas">
    <div class="coluna pendente">
      <h2>Aguardando NF <span class="contador" id="contPendente">0</span></h2>
      <div id="listaPendente"></div>
    </div>
    <div class="coluna concluido">
      <h2>NF Recebidas <span class="contador" id="contConcluido">0</span></h2>
      <div id="listaConcluido"></div>
    </div>
  </div>
</main>

<!-- MODAL DE EDIÇÃO -->
<div class="modal-fundo" id="modalFundo">
  <div class="modal">
    <h3>✏️ Editar registro</h3>
    <div class="campo">
      <label>Fornecedor / Empresa</label>
      <input type="text" id="editFornecedor">
    </div>
    <div class="campo">
      <label>Valor do PIX (R$)</label>
      <input type="text" id="editValor" inputmode="decimal" autocomplete="off">
    </div>
    <div class="campo">
      <label>Descrição</label>
      <input type="text" id="editDesc">
    </div>
    <div class="campo">
      <label>Data do PIX</label>
      <input type="date" id="editData">
    </div>
    <div class="botoes">
      <button class="btn-cancelar" onclick="fecharModal()">Cancelar</button>
      <button class="btn-salvar" onclick="salvarEdicao()">💾 Salvar</button>
    </div>
  </div>
</div>

<script type="importmap">
{
  "imports": {
    "firebase/app": "https://www.gstatic.com/firebasejs/12.18.0/firebase-app.js",
    "firebase/firestore": "https://www.gstatic.com/firebasejs/12.18.0/firebase-firestore.js"
  }
}
</script>

<script type="module">
import { initializeApp } from "firebase/app";
import {
  getFirestore, collection, addDoc, deleteDoc, doc,
  updateDoc, onSnapshot
} from "firebase/firestore";

// ===== CONFIG (a mesma do seu app) =====
const firebaseConfig = {
  apiKey: "AIzaSyAyAtL3v2jSnUd4gGAU0zWXhqI84kngsio",
  authDomain: "fiscalizador-preco.firebaseapp.com",
  projectId: "fiscalizador-preco",
  storageBucket: "fiscalizador-preco.firebasestorage.app",
  messagingSenderId: "968106554702",
  appId: "1:968106554702:web:e812a8e07e2aac33eb5a1f"
};
const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

const COL_EMPRESAS = 'empresas';
const COL_PIX = 'pix';

// ===== ESTADO =====
let empresas = [];
let pix = [];
let empresaAtualId = null;
let editandoId = null;

// ===== HELPERS =====
const statusEl = document.getElementById('status');
function setStatus(msg, tipo = '') {
  statusEl.textContent = msg;
  statusEl.className = tipo;
}

// Formata número para R$ 15.000,00
function fmt(n) {
  return 'R$ ' + Number(n || 0).toLocaleString('pt-BR', {
    minimumFractionDigits: 2,
    maximumFractionDigits: 2
  });
}

function escapeHtml(s) {
  return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({
    '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
  }[c]));
}

function formatarData(iso) {
  if (!iso) return '—';
  const [a, m, d] = iso.split('-');
  return `${d}/${m}/${a}`;
}

// ===== PARSER DE VALOR INTELIGENTE =====
// Aceita: 15000, 15.000, 15.000,00, 15000,50, 15,50, 1.500, 15.5, R$ 15.000,00...
function parseValorBR(str) {
  if (str == null) return NaN;
  let s = String(str).replace(/[^\d.,]/g, '');
  if (!s) return NaN;

  const temPonto = s.includes('.');
  const temVirgula = s.includes(',');

  let normalizado;

  if (temPonto && temVirgula) {
    // Ambos: o que vier por último é o decimal
    const ultimoPonto = s.lastIndexOf('.');
    const ultimaVirgula = s.lastIndexOf(',');
    if (ultimaVirgula > ultimoPonto) {
      normalizado = s.replace(/\./g, '').replace(/,/g, '.');
    } else {
      normalizado = s.replace(/,/g, '');
    }
  } else if (temVirgula) {
    normalizado = s.replace(/,/g, '.');
  } else if (temPonto) {
    const partes = s.split('.');
    const ultimoGrupo = partes[partes.length - 1];
    if (partes.length > 2) {
      normalizado = s.replace(/\./g, '');
    } else if (ultimoGrupo.length === 3) {
      normalizado = s.replace(/\./g, '');
    } else if (ultimoGrupo.length === 1 || ultimoGrupo.length === 2) {
      normalizado = s;
    } else {
      normalizado = s.replace(/\./g, '');
    }
  } else {
    normalizado = s;
  }

  const n = parseFloat(normalizado);
  return isNaN(n) ? NaN : n;
}

function formatarInputValor(input) {
  const n = parseValorBR(input.value);
  if (isNaN(n)) {
    input.value = '';
    return;
  }
  input.value = fmt(n);
}

// ===== EMPRESAS: RENDER =====
function renderEmpresas() {
  const bar = document.getElementById('empresasBar');
  bar.innerHTML = '';

  if (empresas.length === 0) {
    const aviso = document.createElement('span');
    aviso.style.cssText = 'font-size:12px;color:#94a3b8;padding:8px;';
    aviso.textContent = 'Nenhuma empresa. Clique em "+ Nova empresa".';
    bar.appendChild(aviso);
  }

  empresas.forEach(emp => {
    const btn = document.createElement('button');
    btn.className = 'empresa-btn' + (emp.id === empresaAtualId ? ' ativa' : '');
    btn.title = 'Clique para abrir | ✏️ renomear | 🗑 excluir';

    const nome = document.createElement('span');
    nome.textContent = emp.nome;
    nome.onclick = (e) => {
      e.stopPropagation();
      empresaAtualId = emp.id;
      renderTudo();
    };
    btn.appendChild(nome);

    const lapis = document.createElement('span');
    lapis.className = 'lapis';
    lapis.textContent = '✏️';
    lapis.title = 'Renomear';
    lapis.onclick = (e) => {
      e.stopPropagation();
      renomearEmpresa(emp);
    };
    btn.appendChild(lapis);

    const lixo = document.createElement('span');
    lixo.className = 'lixo';
    lixo.textContent = '🗑';
    lixo.title = 'Excluir empresa';
    lixo.onclick = (e) => {
      e.stopPropagation();
      excluirEmpresa(emp);
    };
    btn.appendChild(lixo);

    bar.appendChild(btn);
  });

  const btnNova = document.createElement('button');
  btnNova.className = 'btn-nova';
  btnNova.textContent = '+ Nova empresa';
  btnNova.onclick = novaEmpresa;
  bar.appendChild(btnNova);
}

// ===== EMPRESAS: AÇÕES =====
async function novaEmpresa() {
  const nome = prompt('Nome da nova empresa:');
  if (nome === null) return;
  const limpo = nome.trim();
  if (!limpo) { alert('Digite um nome válido.'); return; }
  if (empresas.some(e => e.nome.toLowerCase() === limpo.toLowerCase())) {
    alert('Já existe uma empresa com esse nome.');
    return;
  }
  try {
    const ref = await addDoc(collection(db, COL_EMPRESAS), {
      nome: limpo,
      criadoEm: new Date().toISOString()
    });
    empresaAtualId = ref.id;
    setStatus('✅ Empresa criada', 'ok');
  } catch (e) {
    alert('Erro ao criar: ' + e.message);
  }
}

async function renomearEmpresa(emp) {
  const novo = prompt(`Renomear "${emp.nome}" para:`, emp.nome);
  if (novo === null) return;
  const limpo = novo.trim();
  if (!limpo || limpo === emp.nome) return;
  if (empresas.some(e => e.id !== emp.id && e.nome.toLowerCase() === limpo.toLowerCase())) {
    alert('Já existe uma empresa com esse nome.');
    return;
  }
  try {
    await updateDoc(doc(db, COL_EMPRESAS, emp.id), { nome: limpo });
    setStatus('✅ Empresa renomeada', 'ok');
  } catch (e) {
    alert('Erro ao renomear: ' + e.message);
  }
}

async function excluirEmpresa(emp) {
  if (empresas.length === 1) {
    alert('Você precisa ter pelo menos 1 empresa.');
    return;
  }
  const qtd = pix.filter(p => p.empresaId === emp.id).length;
  const msg = qtd > 0
    ? `A empresa "${emp.nome}" tem ${qtd} registro(s). Excluir mesmo assim?`
    : `Excluir a empresa "${emp.nome}"?`;
  if (!confirm(msg)) return;

  try {
    const aPagar = pix.filter(p => p.empresaId === emp.id);
    await Promise.all(aPagar.map(p => deleteDoc(doc(db, COL_PIX, p.id))));
    await deleteDoc(doc(db, COL_EMPRESAS, emp.id));
    if (empresaAtualId === emp.id) {
      const restante = empresas.find(e => e.id !== emp.id);
      empresaAtualId = restante ? restante.id : null;
    }
    setStatus('✅ Empresa excluída', 'ok');
  } catch (e) {
    alert('Erro ao excluir: ' + e.message);
  }
}

// ===== RENDER GERAL =====
function renderTudo() {
  renderEmpresas();

  if (!empresaAtualId && empresas.length > 0) {
    empresaAtualId = empresas[0].id;
  }

  const empresaAtual = empresas.find(e => e.id === empresaAtualId);
  document.getElementById('tituloEmpresa').textContent =
    empresaAtual ? empresaAtual.nome : '—';

  if (!empresaAtualId) {
    document.getElementById('resumo').innerHTML = 'Crie uma empresa para começar.';
    document.getElementById('listaPendente').innerHTML =
      '<div class="vazio">Crie uma empresa primeiro.</div>';
    document.getElementById('listaConcluido').innerHTML = '';
    document.getElementById('contPendente').textContent = 0;
    document.getElementById('contConcluido').textContent = 0;
    return;
  }

  const meus = pix.filter(p => p.empresaId === empresaAtualId);
  const pendentes = meus.filter(p => !p.concluido);
  const concluidos = meus.filter(p => p.concluido);

  const totalPendente = pendentes.reduce((s, p) => s + (parseFloat(p.valor) || 0), 0);
  document.getElementById('resumo').innerHTML =
    `<strong>${pendentes.length}</strong> PIX aguardando NF &nbsp;•&nbsp; Total pendente: <strong>${fmt(totalPendente)}</strong>`;

  document.getElementById('contPendente').textContent = pendentes.length;
  document.getElementById('contConcluido').textContent = concluidos.length;

  const divP = document.getElementById('listaPendente');
  const divC = document.getElementById('listaConcluido');

  if (pendentes.length === 0) {
    divP.innerHTML = '<div class="vazio">Nenhum PIX pendente 🎉</div>';
  } else {
    divP.innerHTML = pendentes.map(criarCard).join('');
  }
  if (concluidos.length === 0) {
    divC.innerHTML = '<div class="vazio">Nenhuma NF recebida ainda</div>';
  } else {
    divC.innerHTML = concluidos.map(criarCard).join('');
  }
}

function criarCard(item) {
  const dataFmt = item.data ? formatarData(item.data) : '—';
  return `
    <div class="card ${item.concluido ? 'concluido-card' : ''}">
      <div class="linha1">
        <span class="fornecedor">${escapeHtml(item.fornecedor || '—')}</span>
        <span class="valor">${fmt(item.valor)}</span>
      </div>
      <div class="desc">${escapeHtml(item.descricao || 'Sem descrição')}</div>
      <div class="meta">📅 PIX em ${dataFmt}</div>
      <div class="acoes">
        ${item.concluido
          ? `<button class="btn-voltar" onclick="moverItem('${item.id}', false)">↩ Voltar</button>`
          : `<button class="btn-nf" onclick="moverItem('${item.id}', true)">✅ NF chegou</button>`}
        <button class="btn-editar" onclick="abrirModal('${item.id}')">✏️ Editar</button>
        <button class="btn-excluir" onclick="excluirItem('${item.id}')">🗑 Excluir</button>
      </div>
    </div>
  `;
}

// ===== PIX: AÇÕES =====
async function adicionarPix() {
  if (!empresaAtualId) { alert('Crie uma empresa primeiro.'); return; }

  const inpValor = document.getElementById('inpValor');
  const fornecedor = document.getElementById('inpFornecedor').value.trim();
  const valor = parseValorBR(inpValor.value);
  const descricao = document.getElementById('inpDesc').value.trim();
  const data = document.getElementById('inpData').value;

  if (!fornecedor || isNaN(valor) || valor <= 0) {
    alert('Preencha pelo menos Fornecedor e Valor (maior que zero).');
    return;
  }

  try {
    await addDoc(collection(db, COL_PIX), {
      empresaId: empresaAtualId,
      fornecedor,
      valor,
      descricao,
      data: data || new Date().toISOString().slice(0, 10),
      concluido: false,
      criadoEm: new Date().toISOString()
    });

    document.getElementById('inpFornecedor').value = '';
    inpValor.value = '';
    document.getElementById('inpDesc').value = '';
    document.getElementById('inpData').value = new Date().toISOString().slice(0, 10);

    setStatus('✅ PIX adicionado', 'ok');
  } catch (e) {
    alert('Erro: ' + e.message);
  }
}

async function moverItem(id, concluido) {
  try {
    await updateDoc(doc(db, COL_PIX, id), { concluido });
  } catch (e) {
    alert('Erro: ' + e.message);
  }
}

async function excluirItem(id) {
  if (!confirm('Excluir este registro?')) return;
  try {
    await deleteDoc(doc(db, COL_PIX, id));
  } catch (e) {
    alert('Erro: ' + e.message);
  }
}

// ===== MODAL =====
function abrirModal(id) {
  const item = pix.find(p => p.id === id);
  if (!item) return;
  editandoId = id;
  document.getElementById('editFornecedor').value = item.fornecedor || '';
  document.getElementById('editValor').value = fmt(item.valor);
  document.getElementById('editDesc').value = item.descricao || '';
  document.getElementById('editData').value = item.data || '';
  document.getElementById('modalFundo').classList.add('aberto');
  setTimeout(() => document.getElementById('editFornecedor').focus(), 50);
}

function fecharModal() {
  document.getElementById('modalFundo').classList.remove('aberto');
  editandoId = null;
}

async function salvarEdicao() {
  const editValor = document.getElementById('editValor');
  const fornecedor = document.getElementById('editFornecedor').value.trim();
  const valor = parseValorBR(editValor.value);
  const descricao = document.getElementById('editDesc').value.trim();
  const data = document.getElementById('editData').value;

  if (!fornecedor || isNaN(valor) || valor <= 0) {
    alert('Preencha Fornecedor e Valor (maior que zero).');
    return;
  }

  try {
    await updateDoc(doc(db, COL_PIX, editandoId), {
      fornecedor, valor, descricao,
      data: data || new Date().toISOString().slice(0, 10)
    });
    fecharModal();
    setStatus('✅ Registro atualizado', 'ok');
  } catch (e) {
    alert('Erro: ' + e.message);
  }
}

// fechar modal
document.getElementById('modalFundo').addEventListener('click', (e) => {
  if (e.target.id === 'modalFundo') fecharModal();
});
document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape' && editandoId) fecharModal();
});

// ===== INPUT DE VALOR: FORMATA NO BLUR E ENTER =====
const inpValor = document.getElementById('inpValor');
inpValor.addEventListener('blur', () => formatarInputValor(inpValor));
inpValor.addEventListener('keydown', (e) => {
  if (e.key === 'Enter') formatarInputValor(inpValor);
});

// ===== FIRESTORE: ESCUTA EM TEMPO REAL =====
function escutar() {
  setStatus('🔄 Conectando...');
  let primeiro = true;

  onSnapshot(collection(db, COL_EMPRESAS), snap => {
    empresas = snap.docs
      .map(d => ({ id: d.id, ...d.data() }))
      .sort((a, b) => (a.criadoEm || '').localeCompare(b.criadoEm || ''));

    if (empresas.length > 0 && !empresas.some(e => e.id === empresaAtualId)) {
      empresaAtualId = empresas[0].id;
    }
    renderTudo();
    if (primeiro) { setStatus('✅ Conectado', 'ok'); primeiro = false; }
  }, err => setStatus('❌ ' + err.message, 'erro'));

  onSnapshot(collection(db, COL_PIX), snap => {
    pix = snap.docs.map(d => ({ id: d.id, ...d.data() }));
    renderTudo();
  }, err => console.error(err));
}

// ===== EXPOR PRA onclick =====
window.adicionarPix = adicionarPix;
window.moverItem = moverItem;
window.excluirItem = excluirItem;
window.abrirModal = abrirModal;
window.fecharModal = fecharModal;
window.salvarEdicao = salvarEdicao;

// ===== START =====
document.getElementById('inpData').value = new Date().toISOString().slice(0, 10);
escutar();
</script>
