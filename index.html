<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>🛒 Lista de Compras</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: system-ui, -apple-system, sans-serif;
    background: #0f172a;
    color: #e2e8f0;
    padding: 15px;
    min-height: 100vh;
  }
  h1 { font-size: 1.3em; text-align: center; margin-bottom: 15px; }

  .app {
    max-width: 700px;
    margin: 0 auto;
    display: flex;
    flex-direction: column;
    gap: 12px;
  }

  .card {
    background: #1e293b;
    border-radius: 12px;
    padding: 15px;
  }
  .card h2 {
    font-size: .9em;
    color: #fbbf24;
    margin-bottom: 10px;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }

  /* Formulário */
  .form-linha {
    display: grid;
    grid-template-columns: 1fr 90px 70px auto;
    gap: 6px;
    margin-bottom: 8px;
  }
  @media (max-width: 500px) {
    .form-linha { grid-template-columns: 1fr 1fr; }
    .form-linha button { grid-column: span 2; }
  }
  input {
    padding: 10px;
    border-radius: 8px;
    border: 1px solid #334155;
    background: #0f172a;
    color: white;
    font-size: .9em;
    width: 100%;
  }
  input:focus { outline: none; border-color: #fbbf24; }
  input::placeholder { color: #64748b; }

  button {
    padding: 10px 14px;
    border: none;
    border-radius: 8px;
    cursor: pointer;
    font-weight: bold;
    font-size: .85em;
    color: white;
  }
  .btn-verde { background: #16a34a; }
  .btn-verde:hover { background: #15803d; }
  .btn-azul { background: #2563eb; }
  .btn-vermelho { background: #dc2626; }
  .btn-cinza { background: #475569; }

  /* Sugestão */
  #sugestao {
    font-size: .75em;
    color: #38bdf8;
    padding: 4px 8px;
    margin-bottom: 8px;
    min-height: 20px;
  }
  #sugestao b { color: #fbbf24; }

  /* Lista */
  .item {
    display: grid;
    grid-template-columns: 24px 1fr auto auto;
    gap: 10px;
    align-items: center;
    padding: 10px;
    background: #0f172a;
    border-radius: 8px;
    margin-bottom: 6px;
    border-left: 3px solid #475569;
    transition: .15s;
  }
  .item.comprado {
    opacity: .5;
    border-left-color: #16a34a;
  }
  .item.comprado .nome { text-decoration: line-through; }
  .item .nome { font-weight: 600; font-size: .9em; }
  .item .detalhe { font-size: .75em; color: #94a3b8; margin-top: 2px; }
  .item .preco-atual { color: #fbbf24; font-weight: bold; font-size: .9em; white-space: nowrap; }
  .item input[type="checkbox"] {
    width: 18px; height: 18px; cursor: pointer; accent-color: #16a34a;
  }
  .item .btn-del {
    background: transparent;
    color: #ef4444;
    padding: 4px 8px;
    font-size: 1em;
  }
  .item .btn-del:hover { background: #7f1d1d; }

  /* Total */
  .total {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 12px 15px;
    background: #1e293b;
    border-radius: 12px;
    font-size: 1em;
    border: 2px solid #fbbf24;
  }
  .total b { color: #fbbf24; font-size: 1.2em; }

  /* Status */
  #status {
    font-size: .75em;
    text-align: center;
    padding: 6px;
    border-radius: 6px;
    background: #78350f;
  }
  #status.ok { background: #14532d; }
  #status.erro { background: #7f1d1d; }

  /* Histórico */
  .historico {
    max-height: 150px;
    overflow-y: auto;
    font-size: .8em;
  }
  .historico-linha {
    display: flex;
    justify-content: space-between;
    padding: 5px 8px;
    border-bottom: 1px dashed #334155;
  }
  .historico-linha:last-child { border-bottom: none; }

  .vazio {
    text-align: center;
    padding: 20px;
    font-size: .85em;
    opacity: .5;
  }

  .acoes {
    display: flex;
    gap: 6px;
    margin-top: 8px;
  }
  .acoes button { flex: 1; }
</style>
</head>
<body>

<h1>🛒 Lista de Compras</h1>

<div class="app">

  <div id="status">🔄 Conectando...</div>

  <!-- Adicionar item -->
  <div class="card">
    <h2>➕ Adicionar item</h2>
    <div class="form-linha">
      <input type="text" id="nome" placeholder="Nome do item" autocomplete="off">
      <input type="number" id="preco" placeholder="Preço" step="0.01" min="0">
      <input type="number" id="qtd" placeholder="Qtd" value="1" min="1" step="1">
      <button class="btn-verde" onclick="adicionar()">Adicionar</button>
    </div>
    <div id="sugestao"></div>
  </div>

  <!-- Lista -->
  <div class="card">
    <h2>
      <span>📝 Lista</span>
      <button class="btn-cinza" style="padding:4px 10px; font-size:.75em;" onclick="limparComprados()">🧹 Limpar comprados</button>
    </h2>
    <div id="lista"></div>
  </div>

  <!-- Total -->
  <div class="total">
    <span>💰 Total da lista</span>
    <b id="total">R$ 0,00</b>
  </div>

  <!-- Histórico -->
  <div class="card">
    <h2>📊 Últimos preços pagos</h2>
    <div id="historico" class="historico"></div>
  </div>

</div>

<script type="importmap">
{
  "imports": {
    "firebase/app": "https://www.gstatic.com/firebasejs/12.18.0/firebase-app.js",
    "firebase/firestore": "https://www.gstatic.com/firebasejs/12.18.0/firebase-firestore.js"
  }
}
</script>

<script type="module">
import { initializeApp } from "firebase/app";
import {
  getFirestore, collection, addDoc, getDocs, deleteDoc, doc,
  updateDoc, onSnapshot, query, orderBy
} from "firebase/firestore";

// ===== CONFIG (mantenha a sua) =====
const firebaseConfig = {
  apiKey: "AIzaSyAyAtL3v2jSnUd4gGAU0zWXhqI84kngsio",
  authDomain: "fiscalizador-preco.firebaseapp.com",
  projectId: "fiscalizador-preco",
  storageBucket: "fiscalizador-preco.firebasestorage.app",
  messagingSenderId: "968106554702",
  appId: "1:968106554702:web:e812a8e07e2aac33eb5a1f"
};
const app = initializeApp(firebaseConfig);
const db = getFirestore(app);
const COL = 'compras'; // coleção nova

// ===== ESTADO =====
let itens = [];         // itens da lista atual
let historico = [];     // histórico de preços (nome -> {preco, data})

const statusEl = document.getElementById('status');
function setStatus(msg, tipo = '') {
  statusEl.textContent = msg;
  statusEl.className = tipo;
}

// ===== FORMATAÇÃO =====
const fmt = (n) => 'R$ ' + Number(n).toFixed(2).replace('.', ',');

// ===== ADICIONAR =====
async function adicionar() {
  const nome = document.getElementById('nome').value.trim();
  const preco = parseFloat(document.getElementById('preco').value) || 0;
  const qtd = parseInt(document.getElementById('qtd').value) || 1;

  if (!nome) { alert('Digite o nome do item.'); return; }
  if (preco <= 0) { alert('Digite um preço válido.'); return; }

  try {
    await addDoc(collection(db, COL), {
      nome,
      preco,
      qtd,
      comprado: false,
      data: new Date().toISOString()
    });

    // limpa campos
    document.getElementById('nome').value = '';
    document.getElementById('preco').value = '';
    document.getElementById('qtd').value = '1';
    document.getElementById('sugestao').innerHTML = '';
    document.getElementById('nome').focus();
  } catch (e) {
    setStatus('❌ ' + e.message, 'erro');
  }
}

// ===== CARREGAR HISTÓRICO =====
function calcularHistorico(lista) {
  const mapa = {};
  // ordena por data (mais antigo primeiro)
  const ordenados = [...lista].sort((a, b) =>
    (a.data || '').localeCompare(b.data || '')
  );
  ordenados.forEach(item => {
    const chave = item.nome.toLowerCase().trim();
    if (!mapa[chave] || (item.data || '') > (mapa[chave].data || '')) {
      mapa[chave] = { nome: item.nome, preco: item.preco, data: item.data };
    }
  });
  return Object.values(mapa);
}

// ===== RENDERIZAR LISTA =====
function renderizar() {
  const el = document.getElementById('lista');
  const ativos = itens.filter(i => !i.comprado);
  const comprados = itens.filter(i => i.comprado);

  if (itens.length === 0) {
    el.innerHTML = '<div class="vazio">Nenhum item na lista</div>';
    document.getElementById('total').textContent = fmt(0);
    return;
  }

  const renderItem = (item) => {
    // busca último preço no histórico
    const h = historico.find(x => x.nome.toLowerCase() === item.nome.toLowerCase());
    const ultimoPreco = h ? h.preco : null;
    const mudou = ultimoPreco && ultimoPreco !== item.preco;

    return `
      <div class="item ${item.comprado ? 'comprado' : ''}">
        <input type="checkbox" ${item.comprado ? 'checked' : ''}
               onchange="window.__toggle('${item.id}', ${!item.comprado})">
        <div>
          <div class="nome">${item.nome}</div>
          <div class="detalhe">
            ${item.qtd}x ${fmt(item.preco)}
            ${mudou ? `<span style="color:#f87171;"> (antes ${fmt(ultimoPreco)})</span>` : ''}
          </div>
        </div>
        <div class="preco-atual">${fmt(item.preco * item.qtd)}</div>
        <button class="btn-del" onclick="window.__excluir('${item.id}')">✕</button>
      </div>
    `;
  };

  el.innerHTML = ativos.map(renderItem).join('') +
    (comprados.length ? `<div style="font-size:.7em; color:#64748b; margin:10px 0 4px;">— comprados —</div>` +
      comprados.map(renderItem).join('') : '');

  // total
  const total = ativos.reduce((s, i) => s + i.preco * i.qtd, 0);
  document.getElementById('total').textContent = fmt(total);

  // histórico
  const histEl = document.getElementById('historico');
  if (historico.length === 0) {
    histEl.innerHTML = '<div class="vazio">Sem histórico ainda</div>';
  } else {
    histEl.innerHTML = historico
      .sort((a, b) => (b.data || '').localeCompare(a.data || ''))
      .slice(0, 20)
      .map(h => `
        <div class="historico-linha">
          <span>${h.nome}</span>
          <b style="color:#fbbf24;">${fmt(h.preco)}</b>
        </div>
      `).join('');
  }
}

// ===== AÇÕES =====
async function toggle(id, novoComprado) {
  try {
    await updateDoc(doc(db, COL, id), { comprado: novoComprado });
  } catch (e) {
    setStatus('❌ ' + e.message, 'erro');
  }
}

async function excluir(id) {
  if (!confirm('Excluir este item?')) return;
  try {
    await deleteDoc(doc(db, COL, id));
  } catch (e) {
    setStatus('❌ ' + e.message, 'erro');
  }
}

async function limparComprados() {
  const comprados = itens.filter(i => i.comprado);
  if (!comprados.length) return;
  if (!confirm(`Excluir ${comprados.length} item(ns) comprado(s)?`)) return;
  try {
    await Promise.all(comprados.map(i => deleteDoc(doc(db, COL, i.id))));
  } catch (e) {
    setStatus('❌ ' + e.message, 'erro');
  }
}

// ===== SUGESTÃO AO DIGITAR =====
document.getElementById('nome').addEventListener('input', (e) => {
  const v = e.target.value.toLowerCase().trim();
  const sug = document.getElementById('sugestao');
  if (!v) { sug.innerHTML = ''; return; }

  const encontrados = historico.filter(h => h.nome.toLowerCase().includes(v));
  if (encontrados.length === 0) {
    sug.innerHTML = '';
    return;
  }
  const melhor = encontrados[0];
  sug.innerHTML = `💡 Último preço de <b>${melhor.nome}</b>: ${fmt(melhor.preco)}`;
  // preenche o preço automaticamente
  if (document.getElementById('preco').value === '') {
    document.getElementById('preco').value = melhor.preco;
  }
});

// ===== FIRESTORE: escuta em tempo real =====
function escutar() {
  setStatus('🔄 Conectando...');
  const q = query(collection(db, COL), orderBy('data', 'desc'));

  onSnapshot(q, snap => {
    itens = snap.docs.map(d => ({ id: d.id, ...d.data() }));
    historico = calcularHistorico(itens);
    renderizar();
    setStatus('✅ Sincronizado', 'ok');
  }, err => {
    console.error(err);
    setStatus('❌ ' + err.message, 'erro');
  });
}

// ===== EXPOR =====
window.adicionar = adicionar;
window.__toggle = toggle;
window.__excluir = excluir;
window.limparComprados = limparComprados;

// ===== START =====
escutar();
</script>
</body>
</html>
