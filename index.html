<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>💸 Controle PIX x NF</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: system-ui, -apple-system, sans-serif;
    background: #0f172a;
    color: #e2e8f0;
    padding: 15px;
    min-height: 100vh;
  }
  h1 { font-size: 1.3em; text-align: center; margin-bottom: 15px; }

  .app { max-width: 1100px; margin: 0 auto; display: flex; flex-direction: column; gap: 12px; }

  .card {
    background: #1e293b;
    border-radius: 12px;
    padding: 15px;
  }
  .card h2 {
    font-size: .9em;
    color: #fbbf24;
    margin-bottom: 10px;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }

  #status {
    font-size: .75em;
    text-align: center;
    padding: 6px;
    border-radius: 6px;
    background: #78350f;
  }
  #status.ok { background: #14532d; }
  #status.erro { background: #7f1d1d; }

  /* ===== BARRA DE EMPRESAS ===== */
  .empresas-bar {
    display: flex;
    gap: 6px;
    overflow-x: auto;
    padding-bottom: 4px;
    align-items: center;
    flex-wrap: nowrap;
  }
  .empresa-btn {
    background: #0f172a;
    color: #94a3b8;
    border: 1px solid #334155;
    padding: 8px 12px;
    border-radius: 8px;
    cursor: pointer;
    font-size: .85em;
    white-space: nowrap;
    transition: .15s;
    font-weight: 600;
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .empresa-btn:hover { background: #334155; color: #fff; }
  .empresa-btn.ativa {
    background: #16a34a;
    border-color: #16a34a;
    color: #fff;
  }
  .empresa-btn .lapis, .empresa-btn .lixo {
    font-size: .8em;
    opacity: .6;
    padding: 2px 4px;
    border-radius: 4px;
    transition: .15s;
  }
  .empresa-btn .lapis:hover, .empresa-btn .lixo:hover {
    opacity: 1;
    background: rgba(255,255,255,.15);
  }
  .btn-nova {
    background: #2563eb;
    color: #fff;
    border: none;
    padding: 8px 14px;
    border-radius: 8px;
    cursor: pointer;
    font-size: .85em;
    font-weight: 600;
    white-space: nowrap;
  }
  .btn-nova:hover { background: #1d4ed8; }

  /* ===== RESUMO ===== */
  .resumo {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 12px 15px;
    background: #1e293b;
    border-radius: 12px;
    border: 2px solid #fbbf24;
  }
  .resumo .info { font-size: .85em; color: #94a3b8; }
  .resumo .info b { color: #e2e8f0; }
  .resumo .total-pend { font-size: 1.1em; font-weight: bold; color: #fbbf24; }
  .resumo .total-pend b { font-size: 1.2em; }

  /* ===== FORMULÁRIO ===== */
  .form-linha {
    display: grid;
    grid-template-columns: 1.3fr 100px 1.5fr 130px auto;
    gap: 6px;
  }
  @media (max-width: 800px) {
    .form-linha { grid-template-columns: 1fr 1fr; }
    .form-linha button { grid-column: span 2; }
  }
  input[type="text"], input[type="number"], input[type="date"] {
    padding: 10px;
    border-radius: 8px;
    border: 1px solid #334155;
    background: #0f172a;
    color: white;
    font-size: .9em;
    width: 100%;
  }
  input:focus { outline: none; border-color: #fbbf24; }
  input::placeholder { color: #64748b; }
  input[type="date"]::-webkit-calendar-picker-indicator { filter: invert(1); }

  button {
    padding: 10px 14px;
    border: none;
    border-radius: 8px;
    cursor: pointer;
    font-weight: bold;
    font-size: .85em;
    color: white;
    transition: .15s;
  }
  .btn-verde { background: #16a34a; }
  .btn-verde:hover { background: #15803d; }
  .btn-azul { background: #2563eb; }
  .btn-azul:hover { background: #1d4ed8; }
  .btn-cinza { background: #475569; }
  .btn-cinza:hover { background: #334155; }
  .btn-vermelho { background: #dc2626; }
  .btn-vermelho:hover { background: #b91c1c; }

  /* ===== COLUNAS ===== */
  .colunas {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px;
  }
  @media (max-width: 800px) {
    .colunas { grid-template-columns: 1fr; }
  }

  .coluna {
    background: #1e293b;
    border-radius: 12px;
    padding: 14px;
    min-height: 200px;
  }
  .coluna h2 {
    font-size: .9em;
    margin-bottom: 12px;
    padding-bottom: 10px;
    border-bottom: 2px solid #334155;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  .coluna.pendente h2 { color: #fbbf24; border-color: #78350f; }
  .coluna.concluido h2 { color: #16a34a; border-color: #14532d; }
  .contador {
    background: #0f172a;
    color: #94a3b8;
    font-size: .8em;
    padding: 2px 8px;
    border-radius: 10px;
    font-weight: 600;
  }

  /* ===== CARD ===== */
  .item {
    background: #0f172a;
    border-radius: 8px;
    margin-bottom: 8px;
    border-left: 3px solid #f59e0b;
    padding: 12px;
    transition: .15s;
  }
  .item:hover { box-shadow: 0 2px 8px rgba(0,0,0,.3); }
  .item.concluido { border-left-color: #16a34a; opacity: .85; }

  .item .linha1 {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 6px;
    gap: 8px;
  }
  .item .fornecedor { font-weight: 700; font-size: .95em; color: #e2e8f0; word-break: break-word; }
  .item .valor { font-weight: 700; font-size: .95em; color: #fbbf24; white-space: nowrap; }
  .item.concluido .valor { color: #16a34a; }
  .item .desc { font-size: .8em; color: #94a3b8; margin-bottom: 6px; word-break: break-word; }
  .item .meta { font-size: .75em; color: #64748b; margin-bottom: 10px; }
  .item .acoes { display: flex; gap: 6px; flex-wrap: wrap; }
  .item .acoes button {
    padding: 6px 10px;
    font-size: .8em;
    border-radius: 6px;
  }
  .btn-nf { background: #16a34a; }
  .btn-nf:hover { background: #15803d; }
  .btn-voltar { background: #475569; }
  .btn-voltar:hover { background: #334155; }
  .btn-editar { background: #2563eb; }
  .btn-editar:hover { background: #1d4ed8; }
  .btn-excluir { background: #7f1d1d; }
  .btn-excluir:hover { background: #991b1b; }

  .vazio {
    text-align: center;
    padding: 25px 10px;
    font-size: .85em;
    opacity: .5;
    font-style: italic;
  }

  /* ===== MODAL ===== */
  .modal-fundo {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,.7);
    z-index: 200;
    align-items: center;
    justify-content: center;
    padding: 15px;
  }
  .modal-fundo.aberto { display: flex; }
  .modal {
    background: #1e293b;
    border-radius: 12px;
    padding: 20px;
    width: 100%;
    max-width: 450px;
    box-shadow: 0 10px 40px rgba(0,0,0,.5);
  }
  .modal h3 {
    font-size: 1.05em;
    margin-bottom: 15px;
    color: #fbbf24;
  }
  .modal .campo { display: flex; flex-direction: column; margin-bottom: 10px; }
  .modal label {
    font-size: .75em;
    color: #94a3b8;
    margin-bottom: 4px;
    font-weight: 600;
  }
  .modal input {
    padding: 10px;
    border-radius: 8px;
    border: 1px solid #334155;
    background: #0f172a;
    color: white;
    font-size: .9em;
    width: 100%;
  }
  .modal input:focus { outline: none; border-color: #fbbf24; }
  .modal .botoes {
    display: flex;
    gap: 10px;
    justify-content: flex-end;
    margin-top: 15px;
  }
</style>
</head>
<body>

<h1>💸 Controle PIX x NF</h1>

<div class="app">

  <div id="status">🔄 Conectando...</div>

  <!-- Barra de empresas -->
  <div class="card">
    <h2>🏢 Empresas</h2>
    <div class="empresas-bar" id="empresasBar"></div>
  </div>

  <!-- Resumo -->
  <div class="resumo">
    <div class="info">
      <b id="nomeEmpresaAtual">—</b><br>
      <span id="infoPendentes">0 PIX aguardando NF</span>
    </div>
    <div class="total-pend">
      Pendente: <b id="totalPendente">R$ 0,00</b>
    </div>
  </div>

  <!-- Formulário -->
  <div class="card">
    <h2>➕ Adicionar PIX</h2>
    <div class="form-linha">
      <input type="text" id="inpFornecedor" placeholder="Fornecedor / empresa">
      <input type="number" id="inpValor" placeholder="Valor R$" step="0.01" min="0">
      <input type="text" id="inpDesc" placeholder="Descrição (opcional)">
      <input type="date" id="inpData">
      <button class="btn-verde" onclick="adicionarPix()">Adicionar</button>
    </div>
  </div>

  <!-- Colunas -->
  <div class="colunas">
    <div class="coluna pendente">
      <h2>Aguardando NF <span class="contador" id="contPendente">0</span></h2>
      <div id="listaPendente"></div>
    </div>
    <div class="coluna concluido">
      <h2>NF Recebidas <span class="contador" id="contConcluido">0</span></h2>
      <div id="listaConcluido"></div>
    </div>
  </div>

</div>

<!-- MODAL DE EDIÇÃO -->
<div class="modal-fundo" id="modalFundo">
  <div class="modal">
    <h3>✏️ Editar registro</h3>
    <div class="campo">
      <label>Fornecedor / Empresa</label>
      <input type="text" id="editFornecedor">
    </div>
    <div class="campo">
      <label>Valor do PIX (R$)</label>
      <input type="number" id="editValor" step="0.01" min="0">
    </div>
    <div class="campo">
      <label>Descrição</label>
      <input type="text" id="editDesc">
    </div>
    <div class="campo">
      <label>Data do PIX</label>
      <input type="date" id="editData">
    </div>
    <div class="botoes">
      <button class="btn-cinza" onclick="fecharModal()">Cancelar</button>
      <button class="btn-azul" onclick="salvarEdicao()">💾 Salvar</button>
    </div>
  </div>
</div>

<script type="importmap">
{
  "imports": {
    "firebase/app": "https://www.gstatic.com/firebasejs/12.18.0/firebase-app.js",
    "firebase/firestore": "https://www.gstatic.com/firebasejs/12.18.0/firebase-firestore.js"
  }
}
</script>

<script type="module">
import { initializeApp } from "firebase/app";
import {
  getFirestore, collection, addDoc, deleteDoc, doc,
  updateDoc, onSnapshot
} from "firebase/firestore";

// ===== CONFIG (a mesma do seu app) =====
const firebaseConfig = {
  apiKey: "AIzaSyAyAtL3v2jSnUd4gGAU0zWXhqI84kngsio",
  authDomain: "fiscalizador-preco.firebaseapp.com",
  projectId: "fiscalizador-preco",
  storageBucket: "fiscalizador-preco.firebasestorage.app",
  messagingSenderId: "968106554702",
  appId: "1:968106554702:web:e812a8e07e2aac33eb5a1f"
};
const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

const COL_EMPRESAS = 'empresas';
const COL_PIX = 'pix';

// ===== ESTADO =====
let empresas = [];       // [{id, nome, criadoEm}]
let pix = [];            // [{id, empresaId, fornecedor, valor, descricao, data, concluido}]
let empresaAtualId = null;
let editandoId = null;

// ===== HELPERS =====
const statusEl = document.getElementById('status');
function setStatus(msg, tipo = '') {
  statusEl.textContent = msg;
  statusEl.className = tipo;
}
const fmt = (n) => 'R$ ' + Number(n || 0).toFixed(2).replace('.', ',');

function escapeHtml(s) {
  return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({
    '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
  }[c]));
}

function formatarData(iso) {
  if (!iso) return '—';
  const [a, m, d] = iso.split('-');
  return `${d}/${m}/${a}`;
}

// ===== EMPRESAS: RENDER =====
function renderEmpresas() {
  const bar = document.getElementById('empresasBar');
  bar.innerHTML = '';

  if (empresas.length === 0) {
    bar.innerHTML = '<span style="font-size:.8em; color:#64748b; padding:8px;">Nenhuma empresa. Clique em "+ Nova empresa".</span>';
  }

  empresas.forEach(emp => {
    const btn = document.createElement('button');
    btn.className = 'empresa-btn' + (emp.id === empresaAtualId ? ' ativa' : '');
    btn.title = 'Clique para abrir | ✏️ renomear | 🗑 excluir';

    const nome = document.createElement('span');
    nome.textContent = emp.nome;
    nome.onclick = (e) => {
      e.stopPropagation();
      empresaAtualId = emp.id;
      renderTudo();
    };
    btn.appendChild(nome);

    const lapis = document.createElement('span');
    lapis.className = 'lapis';
    lapis.textContent = '✏️';
    lapis.title = 'Renomear';
    lapis.onclick = (e) => {
      e.stopPropagation();
      renomearEmpresa(emp);
    };
    btn.appendChild(lapis);

    const lixo = document.createElement('span');
    lixo.className = 'lixo';
    lixo.textContent = '🗑';
    lixo.title = 'Excluir empresa';
    lixo.onclick = (e) => {
      e.stopPropagation();
      excluirEmpresa(emp);
    };
    btn.appendChild(lixo);

    bar.appendChild(btn);
  });

  const btnNova = document.createElement('button');
  btnNova.className = 'btn-nova';
  btnNova.textContent = '+ Nova empresa';
  btnNova.onclick = novaEmpresa;
  bar.appendChild(btnNova);
}

// ===== EMPRESAS: AÇÕES =====
async function novaEmpresa() {
  const nome = prompt('Nome da nova empresa:');
  if (nome === null) return;
  const limpo = nome.trim();
  if (!limpo) { alert('Digite um nome válido.'); return; }
  if (empresas.some(e => e.nome.toLowerCase() === limpo.toLowerCase())) {
    alert('Já existe uma empresa com esse nome.');
    return;
  }
  try {
    const ref = await addDoc(collection(db, COL_EMPRESAS), {
      nome: limpo,
      criadoEm: new Date().toISOString()
    });
    empresaAtualId = ref.id;
    setStatus('✅ Empresa criada', 'ok');
  } catch (e) {
    alert('Erro ao criar: ' + e.message);
  }
}

async function renomearEmpresa(emp) {
  const novo = prompt(`Renomear "${emp.nome}" para:`, emp.nome);
  if (novo === null) return;
  const limpo = novo.trim();
  if (!limpo || limpo === emp.nome) return;
  if (empresas.some(e => e.id !== emp.id && e.nome.toLowerCase() === limpo.toLowerCase())) {
    alert('Já existe uma empresa com esse nome.');
    return;
  }
  try {
    await updateDoc(doc(db, COL_EMPRESAS, emp.id), { nome: limpo });
    setStatus('✅ Empresa renomeada', 'ok');
  } catch (e) {
    alert('Erro ao renomear: ' + e.message);
  }
}

async function excluirEmpresa(emp) {
  if (empresas.length === 1) {
    alert('Você precisa ter pelo menos 1 empresa.');
    return;
  }
  const qtd = pix.filter(p => p.empresaId === emp.id).length;
  const msg = qtd > 0
    ? `A empresa "${emp.nome}" tem ${qtd} registro(s). Excluir mesmo assim?`
    : `Excluir a empresa "${emp.nome}"?`;
  if (!confirm(msg)) return;

  try {
    // apaga os PIX da empresa primeiro
    const aPagar = pix.filter(p => p.empresaId === emp.id);
    await Promise.all(aPagar.map(p => deleteDoc(doc(db, COL_PIX, p.id))));
    // apaga a empresa
    await deleteDoc(doc(db, COL_EMPRESAS, emp.id));
    // se era a atual, muda pra primeira que sobrar
    if (empresaAtualId === emp.id) {
      const restante = empresas.find(e => e.id !== emp.id);
      empresaAtualId = restante ? restante.id : null;
    }
    setStatus('✅ Empresa excluída', 'ok');
  } catch (e) {
    alert('Erro ao excluir: ' + e.message);
  }
}

// ===== PIX: RENDER =====
function renderTudo() {
  renderEmpresas();

  if (!empresaAtualId && empresas.length > 0) {
    empresaAtualId = empresas[0].id;
  }

  const empresaAtual = empresas.find(e => e.id === empresaAtualId);
  document.getElementById('nomeEmpresaAtual').textContent = empresaAtual ? empresaAtual.nome : '—';

  if (!empresaAtualId) {
    document.getElementById('listaPendente').innerHTML = '<div class="vazio">Crie uma empresa primeiro.</div>';
    document.getElementById('listaConcluido').innerHTML = '';
    document.getElementById('infoPendentes').textContent = '0 PIX aguardando NF';
    document.getElementById('totalPendente').textContent = fmt(0);
    document.getElementById('contPendente').textContent = 0;
    document.getElementById('contConcluido').textContent = 0;
    return;
  }

  const meus = pix.filter(p => p.empresaId === empresaAtualId);
  const pendentes = meus.filter(p => !p.concluido);
  const concluidos = meus.filter(p => p.concluido);

  const totalPendente = pendentes.reduce((s, p) => s + (parseFloat(p.valor) || 0), 0);
  document.getElementById('infoPendentes').textContent =
    `${pendentes.length} PIX aguardando NF`;
  document.getElementById('totalPendente').textContent = fmt(totalPendente);
  document.getElementById('contPendente').textContent = pendentes.length;
  document.getElementById('contConcluido').textContent = concluidos.length;

  const divP = document.getElementById('listaPendente');
  const divC = document.getElementById('listaConcluido');

  if (pendentes.length === 0) {
    divP.innerHTML = '<div class="vazio">Nenhum PIX pendente 🎉</div>';
  } else {
    divP.innerHTML = pendentes.map(criarCard).join('');
  }
  if (concluidos.length === 0) {
    divC.innerHTML = '<div class="vazio">Nenhuma NF recebida ainda</div>';
  } else {
    divC.innerHTML = concluidos.map(criarCard).join('');
  }
}

function criarCard(item) {
  const dataFmt = item.data ? formatarData(item.data) : '—';
  const valorFmt = (parseFloat(item.valor) || 0).toFixed(2).replace('.', ',');
  return `
    <div class="item ${item.concluido ? 'concluido' : ''}">
      <div class="linha1">
        <span class="fornecedor">${escapeHtml(item.fornecedor || '—')}</span>
        <span class="valor">R$ ${valorFmt}</span>
      </div>
      <div class="desc">${escapeHtml(item.descricao || 'Sem descrição')}</div>
      <div class="meta">📅 PIX em ${dataFmt}</div>
      <div class="acoes">
        ${item.concluido
          ? `<button class="btn-voltar" onclick="moverItem('${item.id}', false)">↩ Voltar</button>`
          : `<button class="btn-nf" onclick="moverItem('${item.id}', true)">✅ NF chegou</button>`}
        <button class="btn-editar" onclick="abrirModal('${item.id}')">✏️ Editar</button>
        <button class="btn-excluir" onclick="excluirItem('${item.id}')">🗑 Excluir</button>
      </div>
    </div>
  `;
}

// ===== PIX: AÇÕES =====
async function adicionarPix() {
  if (!empresaAtualId) { alert('Crie uma empresa primeiro.'); return; }
  const fornecedor = document.getElementById('inpFornecedor').value.trim();
  const valor = parseFloat(document.getElementById('inpValor').value);
  const descricao = document.getElementById('inpDesc').value.trim();
  const data = document.getElementById('inpData').value;

  if (!fornecedor || !valor || valor <= 0) {
    alert('Preencha pelo menos Fornecedor e Valor (maior que zero).');
    return;
  }

  try {
    await addDoc(collection(db, COL_PIX), {
      empresaId: empresaAtualId,
      fornecedor,
      valor,
      descricao,
      data: data || new Date().toISOString().slice(0, 10),
      concluido: false,
      criadoEm: new Date().toISOString()
    });

    document.getElementById('inpFornecedor').value = '';
    document.getElementById('inpValor').value = '';
    document.getElementById('inpDesc').value = '';
    document.getElementById('inpData').value = new Date().toISOString().slice(0, 10);

    setStatus('✅ PIX adicionado', 'ok');
  } catch (e) {
    alert('Erro: ' + e.message);
  }
}

async function moverItem(id, concluido) {
  try {
    await updateDoc(doc(db, COL_PIX, id), { concluido });
  } catch (e) {
    alert('Erro: ' + e.message);
  }
}

async function excluirItem(id) {
  if (!confirm('Excluir este registro?')) return;
  try {
    await deleteDoc(doc(db, COL_PIX, id));
  } catch (e) {
    alert('Erro: ' + e.message);
  }
}

// ===== MODAL =====
function abrirModal(id) {
  const item = pix.find(p => p.id === id);
  if (!item) return;
  editandoId = id;
  document.getElementById('editFornecedor').value = item.fornecedor || '';
  document.getElementById('editValor').value = item.valor || '';
  document.getElementById('editDesc').value = item.descricao || '';
  document.getElementById('editData').value = item.data || '';
  document.getElementById('modalFundo').classList.add('aberto');
  setTimeout(() => document.getElementById('editFornecedor').focus(), 50);
}

function fecharModal() {
  document.getElementById('modalFundo').classList.remove('aberto');
  editandoId = null;
}

async function salvarEdicao() {
  const fornecedor = document.getElementById('editFornecedor').value.trim();
  const valor = parseFloat(document.getElementById('editValor').value);
  const descricao = document.getElementById('editDesc').value.trim();
  const data = document.getElementById('editData').value;

  if (!fornecedor || !valor || valor <= 0) {
    alert('Preencha Fornecedor e Valor (maior que zero).');
    return;
  }

  try {
    await updateDoc(doc(db, COL_PIX, editandoId), {
      fornecedor, valor, descricao,
      data: data || new Date().toISOString().slice(0, 10)
    });
    fecharModal();
    setStatus('✅ Registro atualizado', 'ok');
  } catch (e) {
    alert('Erro: ' + e.message);
  }
}

// fechar modal com ESC ou clique fora
document.getElementById('modalFundo').addEventListener('click', (e) => {
  if (e.target.id === 'modalFundo') fecharModal();
});
document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape' && editandoId) fecharModal();
});

// ===== FIRESTORE: ESCUTA EM TEMPO REAL =====
function escutar() {
  setStatus('🔄 Conectando...');
  let primeiro = true;

  onSnapshot(collection(db, COL_EMPRESAS), snap => {
    empresas = snap.docs
      .map(d => ({ id: d.id, ...d.data() }))
      .sort((a, b) => (a.criadoEm || '').localeCompare(b.criadoEm || ''));

    if (empresas.length > 0 && !empresas.some(e => e.id === empresaAtualId)) {
      empresaAtualId = empresas[0].id;
    }
    renderTudo();
    if (primeiro) { setStatus('✅ Conectado', 'ok'); primeiro = false; }
  }, err => setStatus('❌ ' + err.message, 'erro'));

  onSnapshot(collection(db, COL_PIX), snap => {
    pix = snap.docs.map(d => ({ id: d.id, ...d.data() }));
    renderTudo();
  }, err => console.error(err));
}

// ===== EXPOR PRA onclick =====
window.adicionarPix = adicionarPix;
window.moverItem = moverItem;
window.excluirItem = excluirItem;
window.abrirModal = abrirModal;
window.fecharModal = fecharModal;
window.salvarEdicao = salvarEdicao;

// ===== START =====
document.getElementById('inpData').value = new Date().toISOString().slice(0, 10);
escutar();
</script>
